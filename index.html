<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c81810">
<title>FIRERED — A Fan-Made GBA-Style Adventure</title>
<meta name="description" content="A fan-made FireRed-style monster-catching RPG, playable right in your browser. Catch, battle, and earn the Granite Badge. Built in a single shot by the Claude model Fable 5.">

<!-- Link-sharing previews (Open Graph: WhatsApp, Facebook, Discord, etc.) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="FIRERED">
<meta property="og:title" content="FIRERED — A Fan-Made GBA-Style Adventure">
<meta property="og:description" content="A fan-made FireRed-style monster-catching RPG, playable right in your browser. Catch, battle, and earn the Granite Badge. Built in a single shot by the Claude model Fable 5.">
<meta property="og:url" content="https://fire-red-rpg.vercel.app/">
<meta property="og:image" content="https://fire-red-rpg.vercel.app/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="FIRERED — pixel Charizard on a fire-red background">

<!-- Twitter / X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="FIRERED — A Fan-Made GBA-Style Adventure">
<meta name="twitter:description" content="A fan-made FireRed-style monster-catching RPG, playable right in your browser. Built in a single shot by the Claude model Fable 5.">
<meta name="twitter:image" content="https://fire-red-rpg.vercel.app/assets/og-image.png">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <!-- The whole handheld shell — this is what scales to fit the viewport.
       #screen (the actual display) keeps its own dynamic width so the
       canvas aspect ratio logic in main.js is untouched. -->
  <div id="console">
    <div id="shell-top">
      <span id="shell-brand">GAME BOY <b>ADVANCE</b></span>
      <span id="power-dot"></span>
    </div>

    <div id="screen">
      <!-- 480x320 internal resolution (game logic uses 240x160 via a 2x transform)
           so 32px source art renders at native detail -->
      <canvas id="game" width="480" height="320"></canvas>
      <div id="screen-glare"></div>

      <!-- Battle HUD (info boxes) -->
      <div id="enemy-box" class="info-box hidden">
        <div class="ib-row1"><span class="ib-name"></span><span class="ib-lv"></span></div>
        <div class="ib-row2">
          <span class="ib-status"></span>
          <div class="hp-outer"><div class="hp-label">HP</div><div class="hp-track"><div class="hp-fill"></div></div></div>
        </div>
        <div class="ib-hpnum"></div>
        <div class="ib-balls"></div>
      </div>
      <div id="player-box" class="info-box hidden">
        <div class="ib-row1"><span class="ib-name"></span><span class="ib-lv"></span></div>
        <div class="ib-row2">
          <span class="ib-status"></span>
          <div class="hp-outer"><div class="hp-label">HP</div><div class="hp-track"><div class="hp-fill"></div></div></div>
        </div>
        <div class="ib-hpnum"></div>
        <div class="exp-track"><div class="exp-fill"></div></div>
      </div>

      <!-- Dialog box -->
      <div id="dialog" class="gba-box hidden">
        <div id="dialog-text"></div>
        <div id="dialog-arrow" class="hidden">&#9660;</div>
      </div>

      <!-- Dynamic menu layer (battle menu, moves, party, bag, shop, etc.) -->
      <div id="menu-layer"></div>

      <!-- Fade overlay for transitions -->
      <div id="fade"></div>
    </div>

    <!-- Physical-looking control deck: always visible, click OR touch. -->
    <div id="touch-controls">
      <div id="dpad">
        <div id="dpad-hub"></div>
        <button data-k="up" id="tc-up">&#9650;</button>
        <button data-k="left" id="tc-left">&#9664;</button>
        <button data-k="right" id="tc-right">&#9654;</button>
        <button data-k="down" id="tc-down">&#9660;</button>
      </div>
      <div id="mid-buttons">
        <button data-k="select" id="tc-select" class="pill">SELECT</button>
        <button data-k="start" id="tc-start" class="pill">START</button>
      </div>
      <div id="action-pad">
        <button data-k="b" id="tc-b">B</button>
        <button data-k="a" id="tc-a">A</button>
      </div>
    </div>

    <div id="speaker-grille"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="shoulder-btn left">L</div>
    <div class="shoulder-btn right">R</div>
  </div>
  <div id="hint">Z / SPACE = A &nbsp;&middot;&nbsp; X = B &nbsp;&middot;&nbsp; ENTER = MENU &nbsp;&middot;&nbsp; F = FULLSCREEN &nbsp;&middot;&nbsp; M = SOUND</div>
</div>

<script src="js/audio.js"></script>
<script src="js/data/types.js"></script>
<script src="js/data/moves.js"></script>
<script src="js/data/species.js"></script>
<script src="js/data/sprites.js"></script>
<script src="js/data/assets.js"></script>
<script src="js/data/items.js"></script>
<script src="js/data/maps.js"></script>
<script src="js/ui.js"></script>
<script src="js/save.js"></script>
<script src="js/battle.js"></script>
<script src="js/overworld.js"></script>
<script src="js/main.js"></script>
</body>
</html>
