<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c81810">
<title>PkmnSOL — a tiny walking-around demo</title>
<meta name="description" content="A small, from-scratch Game-Boy-style walking demo: Pallet Town, one house, and Route 1. No battles yet — just movement, map transitions, and one sign to read.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <div id="console">
    <div id="shell-top">
      <span id="shell-brand">GAME BOY <b>ADVANCE</b></span>
      <span id="power-dot"></span>
    </div>

    <div id="screen">
      <div id="game-viewport">
        <canvas id="game" width="320" height="288"></canvas>
        <div id="dialog" class="hidden">
          <div id="dialog-text"></div>
          <div id="dialog-arrow">&#9660;</div>
        </div>
        <div id="fade"></div>
      </div>
    </div>

    <div id="touch-controls">
      <div id="dpad">
        <button data-dir="up" class="dp dp-up">&#9650;</button>
        <button data-dir="left" class="dp dp-left">&#9664;</button>
        <button data-dir="right" class="dp dp-right">&#9654;</button>
        <button data-dir="down" class="dp dp-down">&#9660;</button>
        <div id="dpad-hub"></div>
      </div>
      <button id="btn-a">A</button>
    </div>

    <div id="speaker-grille"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="shoulder-btn left">L</div>
    <div class="shoulder-btn right">R</div>
  </div>
  <div id="hint">ARROWS/WASD move &nbsp;&middot;&nbsp; Z/SPACE = A (talk)</div>
  <div id="build-tag">BUILD 1</div>
</div>

<audio id="bgm" loop></audio>

<script src="js/ui.js"></script>
<script src="js/shell.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
