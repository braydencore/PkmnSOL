<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/favicon_solara-DoTnFTf5.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PkmnSOL</title>

    <!-- Home-screen "app" install support: with the manifest + these Apple
         meta tags, adding this page to the iOS/Android home screen launches
         it with none of the browser's own UI (no URL bar, no tab strip) —
         that chrome is Safari's own and can't be removed by CSS while the
         page is open as a normal browser tab; it only goes away once the
         page is installed and opened from its own home-screen icon. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="apple-touch-icon" href="/ui/apple-touch-icon-solara.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PkmnSOL" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script type="module" crossorigin src="/assets/index-BjXtAFln.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BTSDZzwv.css">
  </head>

  <body>
    <!-- The game canvas fills the whole screen on touch devices, exactly
         like it does on desktop — no console/bezel chrome around it. -->
    <div id="app"></div>

    <!-- Translucent touch controls floating over the game (see
         gba-shell.ts for the input wiring). Only visible on touch-primary
         devices in landscape — see the `.gba-touch` scoping in style.css. -->
    <div id="touch-controls">
      <div id="dpad">
        <div id="dpad-hub"></div>
        <button type="button" data-dir="up" id="tc-up" aria-label="Up">&#9650;</button>
        <button type="button" data-dir="left" id="tc-left" aria-label="Left">&#9664;</button>
        <button type="button" data-dir="right" id="tc-right" aria-label="Right">&#9654;</button>
        <button type="button" data-dir="down" id="tc-down" aria-label="Down">&#9660;</button>
      </div>
      <div id="action-pad">
        <button type="button" data-action="b" id="tc-b" aria-label="B">B</button>
        <button type="button" data-action="a" id="tc-a" aria-label="A">A</button>
      </div>
      <div id="mid-buttons">
        <button type="button" data-action="select" class="pill" aria-label="Select">SELECT</button>
        <button type="button" data-action="start" class="pill" aria-label="Start">START</button>
      </div>
      <button type="button" class="corner-btn top-left" data-action="map" aria-label="Map">MAP</button>
      <button type="button" class="corner-btn top-right" data-action="chat" aria-label="Chat">CHAT</button>
      <button type="button" class="corner-btn bottom-right" data-action="running" aria-label="Toggle running">RUN</button>
    </div>

    <!-- Shown instead of the game when a touch device is held in portrait
         (see the `.gba-touch` + orientation scoping in style.css) — the
         game is a fixed 16:9 landscape shape, so portrait can only ever
         show a small, letterboxed sliver of it. -->
    <div id="rotate-prompt">
      <div id="rotate-icon">&#8635;</div>
      <p>Rotate your device to play</p>
    </div>

    <!-- Shown instead of the game on a touch device that hasn't been added
         to the Home Screen yet — see src/install-gate.ts, which fills in
         #install-gate-steps and toggles this on via `body.install-gate`
         before Phaser (or any game asset) ever loads. There's no way to
         lay the game out well while the browser's own URL bar and tab
         strip are eating into the viewport on top of it, so touch devices
         only get the real game once they're running installed. -->
    <div id="install-gate">
      <img id="install-gate-icon" src="/ui/apple-touch-icon-solara.png" alt="" />
      <h1>Add PkmnSOL to Home Screen</h1>
      <ol id="install-gate-steps"></ol>
    </div>

  </body>
</html>
